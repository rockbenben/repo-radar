# 打 v* tag 时打包，产物先上传到同一条 GitHub Release 草稿（draft）。四个 build job：
# Windows、macOS 各一个 runner，Linux 拆成 x64/arm64 两个 runner（原因见下面矩阵里的注释）。
# 四个全绿之后，publish job 自动把草稿翻成正式发布——不需要人去网页点按钮。
# 中途仍然是草稿（releaseType 见 electron-builder.yml）：只传了一半的产物不该对用户可见，
# 而任何一个平台构建失败，publish 就不会跑，草稿留在原地等人处理。
# 产物：repo-radar-<version>-x64-setup.exe（Windows NSIS，双击安装；命名见 electron-builder.yml）
#      repo-radar-<version>-arm64.dmg / -x64.dmg（macOS，同一个 runner 上交叉出两个架构）
#      repo-radar-<version>-x64.AppImage / -arm64.AppImage（Linux，两个 runner 各出各的）
# 同时产出 latest*.yml。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Linux 拆两个 runner、macOS 只用一个：electron-builder 在 x64 机器上交叉构建 arm64
      # AppImage 不可靠，所以 Linux 的两个架构各自在原生 runner 上构建；macOS 反过来——
      # electron-builder 在 arm64 runner（macos-latest）上可以直接为 x64 下载对应的
      # Electron 二进制来构建 dmg，不需要 Rosetta，一个 runner 就能出两个架构。
      matrix:
        include:
          - { os: windows-latest, label: win }
          - { os: macos-latest, label: mac }
          - { os: ubuntu-latest, label: linux-x64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint # 与 ci 同一道 biome 门禁：发布产物不该绕过它
      # tag 必须与 package.json 版本一致：这个版本号显示在设置面板、进产物文件名、写进 latest.yml。
      # 忘 bump 就发出「版本号与 tag 对不上」的产物——本项目不做自动更新（理由见 electron-builder.yml
      # 的 mac 段），但用户对着 Releases 页挑安装包时照样会被它误导
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || { echo "tag v$TAG 与 package.json 的 $PKG 不一致"; exit 1; }
      - run: npm test
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # 手动触发（不打 tag）时不发布，只上传成 workflow artifact，便于验证构建本身
      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: repo-radar-${{ matrix.label }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/latest*.yml
          if-no-files-found: ignore

  # needs: build 在矩阵上是「四条腿全成功才跑」，正好是「产物到齐」的判据。
  # --latest 显式指定：草稿的创建时间早于发布时间，不写的话 GitHub 有可能不把它算成最新版
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
