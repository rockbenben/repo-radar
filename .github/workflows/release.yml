name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  queue: max

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Require the release tag ref
        if: github.ref_type != 'tag'
        shell: bash
        run: echo '::error::Dispatch this workflow on the target tag ref' && exit 1
      - uses: actions/checkout@v7
        with: { ref: '${{ github.sha }}' }
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - id: version
        run: node .github/scripts/release-version.mjs resolve electron
      - name: Check the remote tag and published release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: node .github/scripts/release-state.mjs guard
      - name: Apply the release version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/release-version.mjs apply electron
      - run: npm ci
      - run: node scripts/check-release-config.mjs
      - run: npm run lint

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: win }
          - { os: macos-latest, label: mac }
          - { os: ubuntu-22.04, label: linux-x64 }
          - { os: ubuntu-22.04-arm, label: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Apply the release version
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: node .github/scripts/release-version.mjs apply electron
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.yml --publish never
      - name: Verify installers and update metadata
        env:
          RELEASE_BUILD: ${{ matrix.label }}
        shell: bash
        run: node scripts/check-release-assets.mjs dist-electron "$RELEASE_BUILD"
      - uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: dist-${{ matrix.label }}
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/latest*.yml
          if-no-files-found: error

  publish:
    concurrency:
      group: desktop-release-publication
      queue: max
    needs: [validate, build]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: staging
      - name: Collect the four builds and verify the release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir out
          for build in win mac linux-x64 linux-arm64; do
            files=(staging/dist-"$build"/*)
            (( ${#files[@]} > 0 )) || { echo "::error::Missing artifacts for $build"; exit 1; }
            for file in "${files[@]}"; do
              name="${file##*/}"
              [[ -f "$file" && ! -e "out/$name" ]] || { echo "::error::Unexpected or duplicate asset: $name"; exit 1; }
              mv -- "$file" "out/$name"
            done
          done
          node scripts/check-release-assets.mjs out
      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd out
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Check the remote tag and published release
        run: node .github/scripts/release-state.mjs guard
      - id: stage
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: out/*
          body: |
            ## Downloads

            - **Windows x64:** NSIS setup executable. The installer is unsigned and may prompt SmartScreen.
            - **macOS Apple Silicon / Intel:** choose the matching DMG. The app is not notarized. Install newer releases manually.
            - **Linux x64 / ARM64:** choose the matching AppImage and mark it executable.

            Git must be installed and available on PATH. GitHub features also use the GitHub CLI.
            Verify downloads against `SHA256SUMS`. The Windows and Linux in-app updaters use the `latest*.yml` manifests.
      - name: Publish the verified draft
        env:
          RELEASE_ID: ${{ steps.stage.outputs.id }}
        run: node .github/scripts/release-state.mjs publish out
      - name: Verify published assets and digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$release" >/dev/null
          published_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [[ "$published_commit" == "$SOURCE_COMMIT" ]] || { echo "::error::$TAG points to $published_commit"; exit 1; }
          cd out
          { cat SHA256SUMS; sha256sum SHA256SUMS; } | while read -r digest path; do
            file="${path#./}"
            jq -e --arg file "$file" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $file and .state == "uploaded" and .digest == $digest)' "$release" >/dev/null \
              || { echo "::error::Missing or mismatched published asset: $file"; exit 1; }
          done
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          newest="$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1)"
          if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$latest" != "$newest" ]]; then
            echo "::error::The updater's latest release ($latest) is older than $TAG or is not stable"
            exit 1
          fi
