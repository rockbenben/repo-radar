# 应用根 = 仓库根（不是 desktop/）。原因：desktop/src/main.ts 用 join(__dirname, "..", "..")
# 从 desktop/dist/main.cjs 回推仓库根，来定位 web/dist 和 ASAR 内的托盘 PNG。
appId: com.rockbenben.repo-radar
productName: repo-radar
# 统一发布资产命名。nsis 默认会产出 `repo-radar Setup <version>.exe`——带空格，作为 GitHub
# Release 下载链接会被编码成一串 %20，命令行下载还要加引号，且与 mac/linux 的连字符命名不一致。
# 这里统一成全小写、连字符、带 arch、无空格的一套规则，三平台一致、URL 干净。
# 用 ${name}（package.json 的 name，恒无空格）而非 ${productName}；nsis 段另加 -setup 标明是安装器。
artifactName: ${name}-${version}-${arch}.${ext}
directories:
  output: dist-electron
# 刻意**不设** buildResources：默认落点是 build/，而那里面只有 installer.nsh——下面
# nsis.include 已经显式引用这一个文件，用不着把整个目录认领成 buildResources。
# 而如果把它指向 scripts/（图标都在那儿），electron-builder 会自动把该目录排除出
# asar——主进程运行时正要从 asar 里读
# scripts/ 下的图标，那样会在打包后静默失效（图标变成空白，无报错）。
# 图标改为在下面各平台段落里用显式相对路径引用

# 服务端与主进程的依赖已由 esbuild 全部打进 desktop/dist/main.cjs，
# 因此除 electron-updater 外不需要任何 node_modules——只带下面这几样东西
# electron-updater 是唯一的例外：它必须以**真实的 node_modules 形式**存在运行时
# （esbuild 把它打进 main.cjs 会让它找不到自己的 package.json 和同目录文件），
# 所以下面不能有 "!**/node_modules"——它会把 electron-updater 一起挡在包外，
# 装出来的应用会在启动时报找不到模块。electron-builder 按 package.json 的
# dependencies 计算该带哪些包，根 package.json 里只有 electron-updater 一个生产依赖，
# 带进去的就是它那一棵树（不涉及 server/web 这两个 workspace 的依赖）。
files:
  - desktop/dist/main.cjs
  - desktop/dist/preload.cjs
  - web/dist/**
  # macOS/Linux 托盘使用 16px + 32px，Electron 自动载入 @2x 变体。
  - scripts/tray-icon.png
  - scripts/tray-icon@2x.png
  - package.json

asar: true

win:
  appId: com.rockbenben.repo-radar.Desktop  # 与 main.ts 的 Windows 安装版标识一致
  target: nsis
  icon: scripts/icon.ico
  extraResources:
    - from: scripts/icon.ico
      to: icon.ico
nsis:
  # 沿用旧 appId 派生的 GUID，以原地升级已有安装。
  guid: c22c52bc-3afa-5460-9659-015bb3ff9cae
  installerLanguages: [en_US]
  displayLanguageSelector: false
  artifactName: ${name}-${version}-${arch}-setup.${ext}   # -setup 标明是安装器，与 mac/linux 的绿色包区分
  oneClick: false                          # 给出安装目录选择：便携习惯的用户不喜欢被塞进 AppData
  perMachine: false                        # 每用户安装，不需要管理员权限（与自启走 HKCU 一致）
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true            # AUMID 挂在这个快捷方式上，Windows 通知依赖它
  include: build/installer.nsh             # 卸载时清理运行时写入的开机自启注册表项，见该文件注释

mac:
  # 只出 dmg，不出 zip。zip 在这里唯一的用途是给 electron-updater 当更新载体，
  # 而 macOS 这一侧暂时用不上：本项目**不签名** macOS 包，而未签名、未公证的 .app
  # 换掉自己就破坏了签名，本来就不能自更新。等签名与公证配好，再把 zip 加回来。
  # （Windows/Linux 那边是有更新通道的：NSIS 与 AppImage 都能就地替换。）
  # arch 同时写 arm64 与 x64：electron-builder 在 arm64 runner（macos-latest）上
  # 也能直接为 x64 下载对应的 Electron 二进制来构建，不需要 Rosetta，一个 runner 出两份 dmg。
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: scripts/icon-512.png               # electron-builder 会从 ≥512px 的 PNG 生成 icns
  category: public.app-category.developer-tools

dmg:
  # macOS 走手动更新，不生成指向 DMG 的自动更新清单或 blockmap。
  writeUpdateInfo: false

linux:
  target: AppImage
  icon: scripts/icon-512.png
  category: Development

publish:
  provider: github
  owner: rockbenben
  repo: repo-radar
  # 这段只用来生成 latest*.yml 里的下载地址，不代表由 electron-builder 去建 release：
  # CI 的 build job 一律 --publish never，release 由 publish job 一次性创建并挂全部产物。
  # 别改回让每个 runner 自己发布——四个 runner 并发建 release 会把同一个 tag 建成两条、
  # 产物随机分两半（v1.3.0 漏 dmg、v1.4.0 漏 setup.exe 就是这么来的，而 CI 四条腿全绿）。
  # 详见 .github/workflows/release.yml 顶部注释。
